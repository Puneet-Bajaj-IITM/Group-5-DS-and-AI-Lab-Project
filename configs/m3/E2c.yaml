# E2c: E1 winner MobileViT-S, logit-adjusted CE, the long-tail baseline (plan 14.2)
run_id: E2c
encoder: mobilevit_s
head: linear
losses: [la_ce]
sampler: weighted
front_end: F0
pooling: gap
mask_head: false
hierarchy: true
input_size: 320
epochs: 20
lr: 3.0e-4
weight_decay: 0.05
batch_size: 64
seed: 42
eval_every: 2
warmup_epochs: 1
subset_path: /kaggle/input/serpentguard-m3-subset/subset.csv
